<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';"
    />
    <title>Image Preview</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { height: 100%; overflow: hidden; }
      body { background: var(--vscode-editor-background, #1e1e1e); color: var(--vscode-foreground, #ccc); font-family: var(--vscode-font-family, sans-serif); }
      :focus-visible { outline: 2px solid var(--vscode-focusBorder) !important; outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
      @media (forced-colors: active) { .ip-thumb--active { outline: 3px solid Highlight !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/imagePreview/main.tsx"></script>
  </body>
</html>
